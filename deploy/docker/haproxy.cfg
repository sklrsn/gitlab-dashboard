global
    log stdout format raw local0
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client  60s
    timeout server  90s

# HAProxy runs as a non-root user in the official image, so it listens on
# 8080/8443 inside the container; docker-compose maps them to 80/443.
frontend http
    bind :8080
    http-request redirect scheme https code 301

frontend https
    bind :8443 ssl crt /usr/local/etc/haproxy/certs/site.pem alpn h2,http/1.1
    http-request set-header X-Forwarded-Proto https
    http-response set-header Strict-Transport-Security "max-age=31536000"
    default_backend dashboard

backend dashboard
    option httpchk GET /healthz
    http-check expect status 200
    server app1 app:8080 check inter 10s
